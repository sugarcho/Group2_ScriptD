# filters_relaxed.yml - Very permissive, only blocks obvious non-ML topics

allow:
  # Minimal list - catches most ML papers
  - "learning"
  - "model"
  - "algorithm"
  - "neural"
  - "data"
  - "prediction"
  - "classification"
  - "detection"
  - "optimization"
  - "evaluation"

deny:
  # Only block very specific non-ML topics
  - "quantum field theory"
  - "string theory"
  - "black hole"
  - "dark matter"
  - "supernova"
  - "galaxy cluster"
  - "cosmic ray"
  - "gravitational wave"
  - "organic synthesis"
  - "gene expression"